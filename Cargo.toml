[package]
name = "tmouseopen"
version = "0.3.0"
edition = "2021"
description = "Linux configurator for the Titorion YDX-GM009 mouse (04f3:026f receiver)"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
